<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Point and Line Renderer - Wireframe Box with WASD + Mouse Look</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            font-family: monospace;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 600px) {
            #info, #controls { font-size: 10px; padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <div id="info">
        ⬜ WHITE WIREFRAME BOX | 🖱️ Mouse to Look | 🎮 WASD to Move
    </div>
    <div id="controls">
        🎯 WASD: Move Forward/Left/Back/Right | 🖱️ Drag to Rotate Camera
    </div>

    <!-- Canvas will be injected by JS -->
    <script>
        (function(){
            // --- setup canvas and context ---
            const canvas = document.createElement('canvas');
            canvas.style.display = 'block';
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            document.body.appendChild(canvas);
            
            // resize handling
            let width = window.innerWidth;
            let height = window.innerHeight;
            
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                // update projection aspect ratio
                updateProjectionMatrix();
            }
            window.addEventListener('resize', resizeCanvas);
            
            // --- 3D data structures ---
            // Define a cube: 8 vertices (x,y,z) range -1 to 1, but scale later for visibility
            // Raw cube vertices centered at origin, side length = 2 (from -1 to 1)
            const rawVertices = [
                [-1, -1, -1], // 0
                [ 1, -1, -1], // 1
                [ 1, -1,  1], // 2
                [-1, -1,  1], // 3
                [-1,  1, -1], // 4
                [ 1,  1, -1], // 5
                [ 1,  1,  1], // 6
                [-1,  1,  1]  // 7
            ];
            
            // Edges: pairs of vertex indices
            const edges = [
                [0,1], [1,2], [2,3], [3,0], // bottom face
                [4,5], [5,6], [6,7], [7,4], // top face
                [0,4], [1,5], [2,6], [3,7]  // vertical edges
            ];
            
            // scale factor for the box (size 3 units makes it noticeable)
            const BOX_SCALE = 2.5;
            
            // transform vertices to world space (centered at origin initially)
            // we will maintain world positions by applying a model matrix per frame (or just keep as is and camera moves)
            // To allow movement, we keep the box fixed in world space, and the camera moves relative to world.
            // So the cube vertices are world coordinates: scaled version.
            let worldVertices = rawVertices.map(v => new THREE_Vector(v[0] * BOX_SCALE, v[1] * BOX_SCALE, v[2] * BOX_SCALE));
            
            // --- Camera system ---
            // Position: where camera is in world space
            // Rotation: yaw (horizontal angle) and pitch (vertical angle)
            let camPos = { x: 0, y: 0, z: 8 };
            let yaw = -Math.PI / 4;   // -45 deg to have a nice initial view
            let pitch = -Math.PI / 6; // -30 deg to look slightly down at box
            
            // Movement speed and sensitivity
            const MOVE_SPEED = 5.0;   // units per second
            const MOUSE_SENS = 0.002;
            
            // Input handling
            const keys = {
                KeyW: false, KeyA: false, KeyS: false, KeyD: false
            };
            
            // Mouse look state
            let mouseCaptured = false;
            let lastMouseX = 0, lastMouseY = 0;
            
            // projection matrix parameters (perspective)
            let projMatrix = new Float32Array(16);
            let fov = 75 * Math.PI / 180; // radians
            let near = 0.1;
            let far = 100.0;
            
            function updateProjectionMatrix() {
                if (height === 0) return;
                const aspect = width / height;
                const tanHalfFov = Math.tan(fov / 2);
                // standard perspective matrix (Row-major? We'll use column-major for multiplication in shader? Actually we'll multiply manually per vertex)
                // We'll build a column-major matrix for projection (OpenGL style).
                // For simplicity in vertex transformation: we'll compute P * V * point manually.
                // But we need projection matrix values.
                // Using column-major:
                // [ 1/(aspect*tanHalfFov), 0, 0, 0 ]
                // [ 0, 1/tanHalfFov, 0, 0 ]
                // [ 0, 0, -(far+near)/(far-near), -1 ]
                // [ 0, 0, -(2*far*near)/(far-near), 0 ]
                // Actually last row typical: [0,0,-1,0] but we'll put w calculation.
                // In standard perspective: 
                // x' = x / (aspect * tanHalfFov) * z? wait no:
                // We'll implement function project(vertex, camTransform) inline.
                // We'll compute projection directly in transformVertex function.
                // But store projection parameters.
                // We don't need full matrix, just the projection factors.
                // For clarity, store projection components.
                window.projParams = {
                    aspect: aspect,
                    fov: fov,
                    near: near,
                    far: far,
                    tanHalfFov: tanHalfFov
                };
            }
            
            // function to compute camera basis vectors (right, up, forward) from yaw/pitch
            function getCameraVectors() {
                const cosYaw = Math.cos(yaw);
                const sinYaw = Math.sin(yaw);
                const cosPitch = Math.cos(pitch);
                const sinPitch = Math.sin(pitch);
                
                // Forward direction (where camera looks)
                const forward = {
                    x: cosYaw * cosPitch,
                    y: sinPitch,
                    z: sinYaw * cosPitch
                };
                // Right vector (cross product of forward and world up (0,1,0) then normalize)
                const worldUp = { x: 0, y: 1, z: 0 };
                const right = {
                    x: forward.y * worldUp.z - forward.z * worldUp.y,
                    y: forward.z * worldUp.x - forward.x * worldUp.z,
                    z: forward.x * worldUp.y - forward.y * worldUp.x
                };
                const lenR = Math.hypot(right.x, right.y, right.z);
                if (lenR > 0.0001) {
                    right.x /= lenR; right.y /= lenR; right.z /= lenR;
                }
                // Up vector (cross product: right x forward)
                const up = {
                    x: right.y * forward.z - right.z * forward.y,
                    y: right.z * forward.x - right.x * forward.z,
                    z: right.x * forward.y - right.y * forward.x
                };
                return { forward, right, up };
            }
            
            // Transform world point to clip space (x,y in [-1,1] range, z for depth, w for perspective)
            // Returns {x, y, z, w} where after perspective divide we get NDC.
            // Also returns a flag if behind near plane (cull)
            function worldToClip(point, camPos, yaw, pitch, proj) {
                // 1. Compute view transform: move point to camera space.
                // Get camera basis
                const { forward, right, up } = getCameraVectors();
                // Translate point relative to camera position
                const relX = point.x - camPos.x;
                const relY = point.y - camPos.y;
                const relZ = point.z - camPos.z;
                // Convert to camera coordinates: dot with basis vectors
                const camX = relX * right.x + relY * right.y + relZ * right.z;
                const camY = relX * up.x + relY * up.y + relZ * up.z;
                const camZ = relX * forward.x + relY * forward.y + relZ * forward.z;
                
                // Perspective projection
                if (camZ <= proj.near) return null; // behind camera or too close
                const invZ = 1.0 / camZ;
                const aspect = proj.aspect;
                const tanHalfFov = proj.tanHalfFov;
                const px = camX / (aspect * tanHalfFov * camZ);
                const py = camY / (tanHalfFov * camZ);
                // NDC x,y in [-1,1] after perspective divide.
                // For depth mapping: map camZ to [0,1] range for depth buffer, but we just need 2D projection
                const ndcX = px;
                const ndcY = py;
                // Also compute depth for optional depth testing but we draw all lines simple order, no depth buffer but we can sort?
                // For simple rendering without depth buffer we just draw lines as they come, but z-fighting may happen.
                // To improve, we could sort edges, but for demo it's fine.
                const depth = (proj.far + proj.near - (2 * proj.near * proj.far) / camZ) / (proj.far - proj.near);
                return { x: ndcX, y: ndcY, z: depth, w: 1.0 };
            }
            
            // --- Core Renderer: draws points and lines using Canvas 2D API (with anti-aliasing) ---
            // We'll draw lines and points manually by projecting vertices.
            // To get a "3D point and line renderer", using Canvas 2D is simpler and still perfectly captures the essence.
            // Alternatively we could use WebGL, but requirement says js without three.js, this approach is valid.
            // For performance and clarity, we'll do 2D transformation.
            
            let ctx = canvas.getContext('2d');
            
            // Cache projected vertices for current frame
            let projectedVertices = [];
            
            function render() {
                // Update canvas dimensions if changed
                if (canvas.width !== width || canvas.height !== height) {
                    canvas.width = width;
                    canvas.height = height;
                    updateProjectionMatrix();
                }
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, width, height);
                
                // 1. Project all world vertices
                const proj = window.projParams;
                if (!proj) return;
                
                projectedVertices = [];
                const validProjections = [];
                for (let i = 0; i < worldVertices.length; i++) {
                    const v = worldVertices[i];
                    const clip = worldToClip(v, camPos, yaw, pitch, proj);
                    if (clip) {
                        // convert NDC (-1..1) to screen coordinates
                        const screenX = (clip.x + 1) * 0.5 * width;
                        const screenY = (1 - (clip.y + 1) * 0.5) * height; // flip Y
                        projectedVertices.push({ x: screenX, y: screenY, depth: clip.z, origIdx: i });
                        validProjections.push(clip);
                    } else {
                        projectedVertices.push(null); // behind camera, mark as null
                    }
                }
                
                // Draw white edges (lines)
                ctx.beginPath();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                // Enhance line width and add slight glow effect
                for (let edge of edges) {
                    const p1 = projectedVertices[edge[0]];
                    const p2 = projectedVertices[edge[1]];
                    if (p1 && p2) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
                
                // Draw white points (vertices) with a small circle
                ctx.fillStyle = 'white';
                for (let projPoint of projectedVertices) {
                    if (projPoint) {
                        ctx.beginPath();
                        ctx.arc(projPoint.x, projPoint.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                        // optional: a tiny highlight
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(projPoint.x, projPoint.y, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'white';
                    }
                }
                
                // Optionally draw some labels or axes? not needed but keep minimal
            }
            
            // --- Movement logic using delta time and camera-relative directions---
            let lastTimestamp = 0;
            function updateMovement(deltaSec) {
                if (deltaSec > 0.033) deltaSec = 0.033; // clamp maximum step
                const speed = MOVE_SPEED * deltaSec;
                const { forward, right } = getCameraVectors();
                let moveDelta = { x: 0, z: 0 };
                
                if (keys.KeyW) { moveDelta.x += forward.x; moveDelta.z += forward.z; }
                if (keys.KeyS) { moveDelta.x -= forward.x; moveDelta.z -= forward.z; }
                if (keys.KeyD) { moveDelta.x += right.x; moveDelta.z += right.z; }
                if (keys.KeyA) { moveDelta.x -= right.x; moveDelta.z -= right.z; }
                
                // normalize diagonal movement to keep speed consistent
                const len = Math.hypot(moveDelta.x, moveDelta.z);
                if (len > 0.01) {
                    moveDelta.x /= len;
                    moveDelta.z /= len;
                }
                
                camPos.x += moveDelta.x * speed;
                camPos.z += moveDelta.z * speed;
                
                // Simple boundary: keep camera within a reasonable range around box (optional)
                // Box extends from -3.75 to 3.75 approx (since scale 2.5, original -1..1 becomes -2.5..2.5)
                // We'll allow free movement but avoid going too far from scene? No constraint necessary but to keep box in view.
                // camera can go through box, it's fine for demonstration.
                // Add small vertical movement maybe? Not required, but could be fun, but only horizontal movement.
                // optionally limit y position? keep y around 1-2? but not necessary
                // keep camera height around 1.5 for better perspective? current y = 0, but allow pitch to look. we can keep y constant? 
                // Actually moving up/down not needed; but users can't change y with WASD, so camera stays at 0 vertical.
                // To improve, we can keep camPos.y at 1.2? But initial look down shows box well.
                // We'll fix camPos.y = 1.2 to get nicer perspective from above.
                // but initial pitch -30 deg, yaw -45, with y=1.2 produces nice view. But if user moves, it's okay.
                // To have smoother ground-like movement, I'll set camPos.y = 1.5.
                camPos.y = 1.5;   // fixed eye level relative to ground (cube center is 0, so we see it well)
            }
            
            // --- Input Handling ---
            function handleKeyDown(e) {
                const code = e.code;
                if (keys.hasOwnProperty(code)) {
                    keys[code] = true;
                    e.preventDefault();
                }
                // optional: lock pointer on click
                if (code === 'Space') {
                    // optional reset camera?
                    e.preventDefault();
                }
            }
            
            function handleKeyUp(e) {
                const code = e.code;
                if (keys.hasOwnProperty(code)) {
                    keys[code] = false;
                    e.preventDefault();
                }
            }
            
            // Mouse look: capture pointer lock for better experience
            canvas.addEventListener('click', () => {
                canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
                if (canvas.requestPointerLock) {
                    canvas.requestPointerLock();
                }
            });
            
            // Handle pointer lock change
            document.addEventListener('pointerlockchange', lockChange);
            document.addEventListener('mozpointerlockchange', lockChange);
            
            function lockChange() {
                if (document.pointerLockElement === canvas) {
                    mouseCaptured = true;
                    // hide default cursor
                    canvas.style.cursor = 'none';
                } else {
                    mouseCaptured = false;
                    canvas.style.cursor = 'default';
                }
            }
            
            // Mouse movement for look
            function onMouseMove(e) {
                if (!mouseCaptured) return;
                const dx = e.movementX || 0;
                const dy = e.movementY || 0;
                yaw += dx * MOUSE_SENS;
                pitch += dy * MOUSE_SENS;
                
                // Limit pitch to avoid flipping (between -PI/2 + epsilon and PI/2 - epsilon)
                const maxPitch = Math.PI / 2 - 0.01;
                const minPitch = -Math.PI / 2 + 0.01;
                if (pitch > maxPitch) pitch = maxPitch;
                if (pitch < minPitch) pitch = minPitch;
                
                // keep yaw unbounded
            }
            
            // Animation loop with delta time
            let previousTime = performance.now() / 1000;
            
            function animate() {
                const now = performance.now() / 1000;
                let dt = Math.min(0.033, now - previousTime);
                if (dt < 0) dt = 0;
                previousTime = now;
                
                updateMovement(dt);
                render();
                
                requestAnimationFrame(animate);
            }
            
            // Initialize projection parameters and start
            function init() {
                resizeCanvas();
                updateProjectionMatrix();
                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                window.addEventListener('mousemove', onMouseMove);
                
                // set initial camera position to a nice viewpoint
                camPos = { x: 0, y: 1.5, z: 7 };
                yaw = -0.8;    // ~ -45 deg
                pitch = -0.35; // ~ -20 deg
                
                // compute world vertices again just to be sure
                worldVertices = rawVertices.map(v => ({ 
                    x: v[0] * BOX_SCALE, 
                    y: v[1] * BOX_SCALE, 
                    z: v[2] * BOX_SCALE 
                }));
                
                previousTime = performance.now() / 1000;
                animate();
            }
            
            // Helper vector class-ish (just for simple immutability)
            function THREE_Vector(x,y,z) { return {x:x, y:y, z:z}; }
            
            // Run init
            init();
        })();
    </script>
</body>
</html>
